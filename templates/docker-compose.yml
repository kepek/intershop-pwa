# export appropriate ICM_BASE_URL and use with
# docker-compose -f templates/docker-compose.yml up --build

version: '3'
services:
  pwa:
    build:
      context: ..
      args:
        # configuration: local
        configuration: production
        serviceWorker: 'false'
    environment:
      - LOGGING=on
      - ICM_BASE_URL
      - ICC_TOKEN
      - ICC_PROXY_URL
      - PROXY_ICM=true
      - TRUST_ICM=true
      # - PROMETHEUS=on
  nginx:
    build: ../nginx
    depends_on:
      - pwa
    environment:
      UPSTREAM_PWA: 'http://pwa:4200'
      DEBUG: 1
      CACHE: 0
      PAGESPEED: 0
      # PROMETHEUS: 1
      # COMPRESSION: 0
      # DEVICE_DETECTION: 0
      # MULTI_CHANNEL_SOURCE: env:///ASDF?type=application/yaml
      MULTI_CHANNEL: |
        .+\.net:
            - baseHref: /en
              lang: en_US
              channel: Camfil-CamfilSE-Site
            - baseHref: /se
              lang: sv_SE
              channel: Camfil-CamfilSE-Site
            - baseHref: /de
              lang: de_DE
              channel: Camfil-CamfilSE-Site
            - baseHref: /fr
              lang: fr_FR
              channel: Camfil-CamfilSE-Site
        .+\.de:
            channel: Camfil-CamfilSE-Site
            lang: de_DE
        .+\.com:
            channel: Camfil-CamfilSE-Site
        .+\.fr:
            channel: Camfil-CamfilSE-Site
            lang: fr_FR
            application: smb-responsive
            features: quoting

    ports:
      - '4200:80'
      # - '9113:9113'
