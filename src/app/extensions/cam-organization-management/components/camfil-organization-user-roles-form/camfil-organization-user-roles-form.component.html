<mat-card class="mat-elevation-z box-shadow mb-2 p-0">
  <mat-card-content>
    <mat-selection-list [(ngModel)]="selectedRoleIDs" (selectionChange)="onCustomerUserRolesChange()" dense>
      <mat-list-option
        *ngFor="let role of roles"
        [value]="role.id"
        [disabled]="isDisabledRole(role)"
        checkboxPosition="before"
        color="primary"
      >
        {{ role.displayName }}
      </mat-list-option>
    </mat-selection-list>
  </mat-card-content>
</mat-card>
