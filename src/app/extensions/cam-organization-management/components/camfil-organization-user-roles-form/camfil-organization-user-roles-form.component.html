<mat-card class="mat-elevation-z box-shadow mb-2 p-0">
  <mat-card-content>
    <mat-selection-list [(ngModel)]="selectedOptions" (selectionChange)="onCustomerUserRolesChange()" dense>
      <mat-list-option
        *ngFor="let option of options"
        [value]="option.id"
        [disabled]="option.disabled"
        checkboxPosition="before"
        color="primary"
      >
        {{ option.displayName }}
      </mat-list-option>
    </mat-selection-list>
  </mat-card-content>
</mat-card>
