<mat-card class="ahu-cart">
  <mat-card-header class="ahu-cart__header">
    <mat-card-title class="ahu-cart__title">Scroll down to select your air filter</mat-card-title>
    <dl clas="ahu-cart__products">
      <ng-container *ngFor="let b of basket">
        <dt class="ahu-cart__slot">{{ b.ahuSlotTypeName }}</dt>
        <dd>
          <ng-container *ngIf="b.items.length; else noItems">
            <p *ngFor="let item of b.items">{{ item.quantity }} x {{ item.sku }}</p>
          </ng-container>
        </dd>
      </ng-container>
      <ng-template #noItems>
        <a>Select air filter</a>
      </ng-template>
    </dl>
  </mat-card-header>
  <mat-card-content class="ahu-cart__content text-center">
    <span class="ahu-cart__total">Total Cost</span>
    <span class="ahu-cart__total-value">{{ summary.total | ishPrice }}</span>
    <button mat-raised-button class="ahu-cart__btn secondary-button mt-2 mb-2" [disabled]="!isConfirmed">
      <mat-icon svgIcon="plus"></mat-icon> Add selected products to CamCard
    </button>
    <button mat-raised-button class="ahu-cart__btn" color="primary" [disabled]="!isConfirmed">
      <mat-icon svgIcon="cart" class="color-light"></mat-icon>Add selected products to cart
    </button>
  </mat-card-content>
</mat-card>
