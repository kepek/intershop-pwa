<mat-card class="ahu-cart">
  <mat-card-header class="ahu-cart__header">
    <mat-card-title class="ahu-cart__title">
      {{ 'camfil.ahu.cart.scroll_down_to_select_air_filter' | translate }}
    </mat-card-title>
    <dl clas="ahu-cart__products">
      <ng-container *ngFor="let ahuAirSlot of basket">
        <dt class="ahu-cart__slot">
          <ng-container *ngIf="isAhuUnitSlotValid$(unit, ahuAirSlot.ahuSlotId) | async">
            <mat-icon svgIcon="checkmark" class="slot__icon mr-2"></mat-icon>
          </ng-container>
          {{ ahuAirSlot.ahuSlotTypeName }}
        </dt>
        <dd>
          <ng-container *ngIf="ahuAirSlot.items.length; else noItems">
            <div *ngFor="let item of ahuAirSlot.items">
              <ng-container *ngIf="getAhuUnitSlotItemProduct$(unit, ahuAirSlot.ahuSlotId, item.sku) | async as product">
                <small>{{ item.quantity }} x {{ product.name }}</small>
              </ng-container>
            </div>
          </ng-container>
        </dd>
        <ng-template #noItems>
          <a (click)="scrollToAnchor(ahuAirSlot.ahuSlotTypeSlug)">
            {{ 'camfil.ahu.cart.select_air_filter' | translate }}
          </a>
        </ng-template>
      </ng-container>
    </dl>
  </mat-card-header>
  <mat-card-content class="ahu-cart__content text-center">
    <span class="ahu-cart__total">
      {{ 'camfil.ahu.cart.summary.total_cost.label' | translate }}
    </span>
    <span class="ahu-cart__total-value">
      {{ summary.total | ishPrice }}
    </span>
    <camfil-products-add-to-cam-card
      class="ahu-cart__btn mt-2 mb-2"
      displayType="round-btn"
      hasIcon="true"
      [disabled]="!isConfirmed"
      [products]="selectedAhuUnitBasketProducts$ | async"
      [translationKey]="'camfil.ahu.cart.summary.button.add_selected_to_camcard.label'"
    ></camfil-products-add-to-cam-card>
    <camfil-products-add-to-basket
      class="ahu-cart__btn mt-2 mb-2"
      displayType="button"
      hasIcon="true"
      [disabled]="!isConfirmed"
      [products]="selectedAhuUnitBasketProducts$ | async"
      [translationKey]="'camfil.ahu.cart.summary.button.add_selected_to_cart.label'"
    ></camfil-products-add-to-basket>
  </mat-card-content>
</mat-card>
