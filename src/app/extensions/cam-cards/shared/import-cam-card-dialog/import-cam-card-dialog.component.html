<h2 class="text-center">
  <mat-icon svgIcon="camcard"></mat-icon>
  <div class="mt-3 mb-5">Import CamCard</div>
</h2>

<div class="dnd-container" filednd (fileDropped)="onFileDropped($event)">
  <input
    type="file"
    #fileDropRef
    id="fileDropRef"
    (change)="onFileChange($event)"
    accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
  />
  <h3>Drag and drop file here</h3>
  <h3>or</h3>
  <label for="fileDropRef">Browse for file</label>
</div>
<div class="errors-container" *ngIf="validationErrors.length">
  <p class="error-text" *ngFor="let error of validationErrors">
    {{ error }}
  </p>
</div>
<div class="files-list">
  <div class="single-file" *ngFor="let file of files; let i = index">
    <div class="file-icon" style="width: 50px">
      <mat-icon svgIcon="camcard"></mat-icon>
    </div>
    <div class="info">
      <h4 class="name">
        {{ file?.name }}
      </h4>
    </div>
  </div>
  <div class="invalid-rows-container" *ngIf="isValidationCompleted && invalidRows?.length">
    <p>There are some rows that contain invalid data. Do you want to import valid rows?</p>
  </div>

  <div class="col-12 text-right p-0">
    <button
      *ngIf="isValidationCompleted && validRows?.length && camCard?.length"
      mat-flat-button
      class="btn-tool text-primary"
      type="submit"
      type="submit"
      (click)="submitImportCamCardForm()"
      data-testing-id="cam-card-dialog-import-submit"
    >
      Import
    </button>
    <button mat-flat-button class="btn-tool text-primary" type="button" (click)="dialogRef.close()">Cancel</button>
  </div>
</div>

<ish-loading *ngIf="loading"></ish-loading>
<ish-loading *ngIf="camCardLoading$ | async"></ish-loading>
