<!-- display addToCamCard Icon/animated Icon or link-->
<ng-template #buttonInner>
  <ng-container [ngSwitch]="displayType">
    <ng-template [ngSwitchCase]="'animated'">
      <fa-icon [icon]="['fas', 'list']" [title]="translationKey | translate"></fa-icon>
      <span class="share-label">{{ translationKey | translate }}</span>
    </ng-template>
    <ng-template [ngSwitchCase]="'icon'">
      <mat-icon svgIcon="add-camcard" [title]="translationKey | translate"></mat-icon>
    </ng-template>
    <ng-template [ngSwitchCase]="'round-btn'">
      <mat-icon svgIcon="add-camcard" *ngIf="hasIcon"></mat-icon>
      <span class="button-text">{{ translationKey | translate }} </span></ng-template
    >
    <ng-template ngSwitchDefault>
      {{ translationKey | translate }}
    </ng-template>
  </ng-container>
</ng-template>

<ng-container *ngIf="hasIcon">
  <button
    mat-raised-button
    data-testing-id="addToCamCardButton"
    class="btn btn-link"
    [ngClass]="class"
    [disabled]="disabled"
    (click)="openModal(modal)"
    [class.camcard-big-round-btn]="displayType === 'round-btn' && !hasIcon"
  >
    <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
  </button>
</ng-container>

<ng-container *ngIf="displayType === 'round-btn' && !hasIcon">
  <button
    mat-stroked-button
    data-testing-id="addToCamCardButton"
    class="btn btn-link"
    [ngClass]="class"
    [disabled]="disabled"
    (click)="openModal(modal)"
    [class.camcard-big-round-btn]="displayType === 'round-btn' && !hasIcon"
  >
    <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
  </button>
</ng-container>

<camfil-add-products-to-cam-card-modal
  #modal
  [products]="products"
  (submitEmitter)="addProductToCamCard($event)"
></camfil-add-products-to-cam-card-modal>
