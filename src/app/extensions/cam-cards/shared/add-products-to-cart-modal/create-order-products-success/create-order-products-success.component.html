<camfil-cam-card-modal
  [subtitle]="'camfil.modal.addProductsToCart.title' | translate"
  [customHeaderTemplate]="customSuccessHeader"
  [primaryButtonTitle]="'camfil.modal.createOrder.button.continue' | translate"
  (primaryButtonClicked)="hide()"
  [secondaryButtonTitle]="'camfil.modal.createOrder.button.go_to_cart' | translate"
  (secondaryButtonClicked)="goToCart()"
  (hiddenClicked)="hide()"
>
</camfil-cam-card-modal>

<ng-template #customSuccessHeader>
  <div class="create-order-product-success__header">
    <mat-icon class="size-24 color-dark" svgIcon="checkmark"></mat-icon>
    <h2 mat-dialog-title class="create-order-product-success__text">
      {{ 'camfil.modal.createOrder.success.title' | translate }}
    </h2>
  </div>
</ng-template>
