<!-- display addToCamCard Icon/animated Icon or link-->
<ng-template #buttonInner>
  <ng-container [ngSwitch]="displayType">
    <ng-template [ngSwitchCase]="'animated'">
      <fa-icon [icon]="['fas', 'list']" [title]="buttonTranslationKey | translate"></fa-icon>
      <span class="share-label">{{ buttonTranslationKey | translate }}</span>
    </ng-template>
    <ng-template [ngSwitchCase]="'icon'">
      <mat-icon svgIcon="add-camcard" [title]="buttonTranslationKey | translate"></mat-icon>
    </ng-template>
    <ng-template [ngSwitchCase]="'round-btn'">
      <mat-icon svgIcon="add-camcard" *ngIf="hasIcon"></mat-icon>
      <span class="button-text">{{ buttonTranslationKey | translate }}</span>
    </ng-template>
    <ng-template ngSwitchDefault>
      {{ buttonTranslationKey | translate }}
    </ng-template>
  </ng-container>
</ng-template>

<ng-container [ngSwitch]="displayType">
  <ng-template [ngSwitchCase]="'icon'">
    <button
      mat-mini-fab
      data-testing-id="addToCamCardButton"
      class="btn btn-link bg-white p-0"
      [ngClass]="class"
      [disabled]="disabled"
      (click)="openModal(modal)"
    >
      <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
    </button>
  </ng-template>
  <ng-template [ngSwitchCase]="'round-btn'">
    <button
      mat-stroked-button
      data-testing-id="addToCamCardButton"
      class="btn btn-link camcard-big-round-btn"
      [ngClass]="class"
      [disabled]="disabled"
      (click)="openModal(modal)"
    >
      <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
    </button>
  </ng-template>
  <ng-template ngSwitchDefault>
    <button
      mat-raised-button
      data-testing-id="addToCamCardButton"
      class="btn btn-link camcard-btn"
      [ngClass]="class"
      [disabled]="disabled"
      (click)="openModal(modal)"
    >
      <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
    </button>
  </ng-template>
</ng-container>

<camfil-add-product-to-cam-card-modal
  #modal
  [product]="product"
  [quantity]="quantity"
  (submitEmitter)="addProductToCamCard($event)"
></camfil-add-product-to-cam-card-modal>

<camfil-small-cta-modal
  actionTitle="{{ 'camfil.account.cam_card.add_to_camcard.error.quantity.header' | translate }}"
  actionButtonTitle="{{ 'camfil.account.cam_card.add_to_camcard.error.quantity.button.ok' | translate }}"
  onlyAccept="true"
  hasError="true"
>
</camfil-small-cta-modal>
