<div class="camfil-modal">
  <div class="border-bottom">
    <div *ngIf="!customHeaderTemplate" class="camfil-modal__title">
      <mat-icon class="camfil-modal__title--icon size-24 color-light">{{ iconName }}</mat-icon>
      <h2 mat-dialog-title class="camfil-modal__title--text">{{ title }}</h2>
    </div>
    <h3 class="camfil-modal__subtitle">{{ subtitle }}</h3>

    <div *ngIf="customHeaderTemplate">
      <ng-container [ngTemplateOutlet]="customHeaderTemplate"></ng-container>
    </div>
  </div>

  <div *ngIf="detailsTemplate" class="camfil-modal__details border-bottom">
    <ng-container [ngTemplateOutlet]="detailsTemplate"></ng-container>
  </div>

  <div *ngIf="searchTemplate" class="camfil-modal__search border-bottom">
    <h3 class="camfil-modal__subtitle camfil-modal__subtitle--search">{{ searchTitle }}</h3>
    <ng-container [ngTemplateOutlet]="searchTemplate"></ng-container>
  </div>

  <div class="camfil-modal__main-content">
    <ng-container [ngTemplateOutlet]="mainContentTemplate"></ng-container>
  </div>

  <div class="camfil-modal__buttons-wrapper">
    <button
      *ngIf="primaryButtonTitle"
      class="camfil-modal__buttons-wrapper--button button__ghost"
      mat-raised-button
      (click)="emitPrimary()"
    >
      {{ primaryButtonTitle }}
    </button>
    <button
      *ngIf="secondaryButtonTitle"
      class="camfil-modal__buttons-wrapper--button"
      mat-raised-button
      color="primary"
      (click)="emitSecondary()"
      [disabled]="secondaryDisabled"
    >
      {{ secondaryButtonTitle }}
    </button>
  </div>
</div>
