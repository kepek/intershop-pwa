<div class="article-details">
  <ng-container *ngIf="requiresMeasurement">
    <h3 class="m-0 text-center text-capitalize w-100">
      <b>{{ 'camfil.modal.addToCamcard.measurement.choose.header' | translate }}</b>
    </h3>
    <div class="article-details__measurement d-flex flex-wrap w-100 pt-3">
      <div [formGroup]="quantityForm" class="form-group">
        <input
          matInput
          [placeholder]="'camfil.modal.addToCamcard.width.label' | translate"
          formControlName="measurementWidth"
          (keyup)="validateVal()"
          type="number"
          class="mat-elevation-z2"
        />
      </div>
      <div [formGroup]="quantityForm" class="form-group">
        <input
          matInput
          [placeholder]="'camfil.modal.addToCamcard.height.label' | translate"
          formControlName="measurementHeight"
          (keyup)="validateVal()"
          type="number"
          class="mat-elevation-z2"
        />
      </div>
      <div [formGroup]="quantityForm" class="form-group">
        <input
          matInput
          [placeholder]="'camfil.modal.addToCamcard.diameter.label' | translate"
          formControlName="measurementDiameter"
          (keyup)="validateVal()"
          type="number"
          class="mat-elevation-z2"
        />
      </div>
      <div
        *ngIf="filledMeasurements?.length"
        class="article-details__ico mt-2"
        [ngClass]="{ 'rounded-circle': filledMeasurements?.length === 1 }"
      ></div>

      <div class="w-100">
        <span innerHTML="{{ 'camfil.modal.addToCamcard.measurement.note.text' | translate }}"></span>
        <div *ngIf="showError" class="text-danger">
          {{ 'camfil.modal.addToCamcard.measurement.error' | translate: { '0': maxVal } }}
        </div>
        <hr class="m-2" />
      </div>
    </div>
  </ng-container>

  <div>
    <mat-form-field [formGroup]="quantityForm" appearance="outline">
      <mat-label>{{ 'camfil.modal.addToCamcard.box.label' | translate }}</mat-label>
      <input matInput formControlName="boxLabel" />
    </mat-form-field>

    <camfil-error
      [errors]="getField('boxLabel').errors"
      [errorValidators]="validators.boxLabel"
      [touched]="getField('boxLabel').touched || getField('boxLabel').dirty"
    ></camfil-error>
  </div>

  <div class="article-details__quantity">
    <mat-label class="article-details__label article-details__quantity--label">{{
      'camfil.modal.addToCamcard.quantity.label' | translate
    }}</mat-label>
    <camfil-product-quantity
      class="article-details__quantity--input"
      [type]="'counter'"
      [allowZeroQuantity]="false"
      [quantityLabel]="'camfil.modal.addToCamcard.quantity.label' | translate"
      [product]="product"
      [parentForm]="quantityForm"
      controlName="quantity"
    ></camfil-product-quantity>
  </div>
</div>
