<br />
<div class="cam-card">
  <h1 class="d-flex align-items-center">
    <mat-icon svgIcon="camcard" class="size-37"></mat-icon> &nbsp;
    {{ 'camfil.account.cam_card.heading' | translate }}
  </h1>

  <!-- Error message -->
  <camfil-error-message [error]="camCardError$ | async"></camfil-error-message>

  <camfil-account-cam-card-list
    [deviceType]="deviceType$ | async"
    [camCards]="camCard$ | async"
    [camCardLoading]="camCardLoading$ | async"
    (addCamCard)="addCamCard($event)"
  ></camfil-account-cam-card-list>
</div>

<camfil-modal-dialog
  #processingDialog
  [options]="{
    titleText: 'camfil.system_is_processing.heading.text' | translate,
    confirmText: 'camfil.system_is_processing.button.confirm' | translate,
    rejectText: 'camfil.system_is_processing.button.reject' | translate
  }"
>
  {{ 'camfil.system_is_processing.body.text' | translate }}
</camfil-modal-dialog>
