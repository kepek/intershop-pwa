<br />
<div class="cam-card">
  <h1 class="d-flex align-items-center">
    <mat-icon svgIcon="camcard" class="size-37"></mat-icon> &nbsp;
    {{ 'camfil.account.cam_card.heading' | translate }}
  </h1>

  <!-- Error message -->
  <ish-error-message [error]="camCardError$ | async"></ish-error-message>

  <camfil-account-cam-card-list
    [deviceType]="deviceType$ | async"
    [camCards]="camCard$ | async"
    [camCardLoading]="camCardLoading$ | async"
    (addCamCard)="addCamCard($event)"
  ></camfil-account-cam-card-list>
</div>
