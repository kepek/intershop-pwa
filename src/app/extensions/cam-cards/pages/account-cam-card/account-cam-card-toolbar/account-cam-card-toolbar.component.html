<div class="row toolbar-container" [ngClass]="{ 'sticky box-shadow': isSticky }">
  <div class="{{ isSticky ? 'container' : 'col-12' }} text-right">
    <button
      mat-stroked-button
      color="primary"
      class="btn-tool secondary-button"
      data-testing-id="import-cam-card"
      (click)="importCamCard($event)"
    >
      <mat-icon svgIcon="create-camcard" class="size-15"></mat-icon>
      {{ 'camfil.account.import.header.text' | translate }}
    </button>
    <button
      mat-stroked-button
      color="primary"
      class="btn-tool secondary-button"
      data-testing-id="add-cam-card"
      routerLink="/account/camcards/create"
    >
      <mat-icon svgIcon="plus" class="crop"></mat-icon>
      {{ 'camfil.account.cam_card.list.button.add_cam_card.label' | translate }}
    </button>
    <button
      mat-stroked-button
      color="primary"
      class="btn-tool secondary-button"
      disabled="{{ checkedCamCards?.length !== 1 }}"
      data-testing-id="copy-cam-card"
      (click)="copy($event)"
    >
      <mat-icon svgIcon="copy" class="size-15"></mat-icon>
      <span class="d-none d-lg-inline-block pl-1">{{
        'camfil.account.cam_card.list.button.copy.label' | translate
      }}</span>
    </button>
    <button
      mat-stroked-button
      color="primary"
      class="btn-tool secondary-button"
      disabled="{{ !checkedCamCards?.length }}"
      data-testing-id="move-cam-card"
      (click)="move($event)"
    >
      <mat-icon svgIcon="move" class="size-15"></mat-icon>
      <span class="d-none d-lg-inline-block pl-1">{{
        'camfil.account.cam_card.list.button.move.label' | translate
      }}</span>
    </button>
    <camfil-account-cam-card-pdf
      [camCards]="checkedCamCards"
      class="btn-tool secondary-button d-none d-sm-inline-block"
    ></camfil-account-cam-card-pdf>

    <button
      mat-stroked-button
      color="primary"
      class="btn-tool secondary-button"
      data-testing-id="add-cam-card"
      (click)="addToCart()"
      [disabled]="isAddToCartBtnDisabled()"
    >
      <mat-icon svgIcon="cart" class="size-15"></mat-icon>
      {{ 'camfil.account.cam_card.list.button.add_to_cart.label' | translate }}
    </button>
    <camfil-loading *ngIf="basketLoading || productAddingInProgress"></camfil-loading>
  </div>
</div>
<camfil-cam-card-preferences-dialog #addCamCardDialog (submit)="add($event)"></camfil-cam-card-preferences-dialog>
