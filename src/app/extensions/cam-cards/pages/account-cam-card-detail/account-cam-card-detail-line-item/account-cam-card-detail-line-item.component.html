<ng-container *ngIf="product$ | async as product">
  <div class="line-item d-flex align-items-center text-left">
    <div class="d-flex align-items-center align-self-start align-self-md-center text-left">
      <ng-container *ngIf="isViewMode">{{ index }}</ng-container>
      <a class="image ml-0 mx-md-3" [routerLink]="product | ishProductRoute">
        <camfil-product-image [product]="product" imageType="S" class="product-image"></camfil-product-image>
      </a>
      <div class="my-2 my-md-0">
        <div class="d-flex flex-row">
          <camfil-product-title [product]="product" [class]="'text-truncate'"></camfil-product-title
          ><camfil-product-inventory class="px-2" [product]="product"></camfil-product-inventory>
        </div>
        <div class="attributes">
          <camfil-product-attribute name="camfil.product.id.label" [value]="product.sku"></camfil-product-attribute>
          <camfil-product-attribute name="Dimensions" [value]="product.sku"></camfil-product-attribute>
          <camfil-product-attribute name="Efficiency" [value]="product.sku"></camfil-product-attribute>
          <ng-container *ngIf="isViewMode">
            <camfil-product-attribute
              name="comment.label"
              [value]="camCardItemData.comment.label"
              *ngIf="camCardItemData.comment.label"
            ></camfil-product-attribute>
            <camfil-product-attribute name="Quantity" [value]="camCardItemData.quantity"></camfil-product-attribute>
            <ng-container *ngTemplateOutlet="price"></ng-container>
          </ng-container>
          <a class="quick-view" (click)="openQuickViewDialog(camCardItemData); $event.stopPropagation()">
            <mat-icon svgIcon="search" class="size-16"></mat-icon>
            {{ 'Quickview' | translate }}
          </a>
        </div>
      </div>
    </div>
    <camfil-cam-card-product-comment
      *ngIf="isEditMode || camCardItemData.comment?.label"
      [ngClass]="{ 'align-self-end': isViewMode, 'ml-md-auto': isEditMode }"
      [currentCamCard]="currentCamCard"
      [camCardItem]="camCardItemData"
      [mode]="mode"
    ></camfil-cam-card-product-comment>
    <ng-container *ngIf="isEditMode">
      <div class="quantity-row d-flex flex-row justify-content-between align-items-center py-3 py-md-0">
        <a
          class="btn-tool delete-cam-card"
          [ngClass]="{ 'ml-md-auto': isEditMode }"
          (click)="removeProductFromCamCard(camCardItemData?.id)"
          data-testing-id="delete-cam-card"
        >
          <mat-icon svgIcon="delete" class="size-16 mx-2"></mat-icon>
        </a>
        <form [formGroup]="addToCartForm" *ngIf="product.inStock && product.availability">
          <camfil-product-quantity
            [allowZeroQuantity]="false"
            [quantityLabel]="''"
            [product]="product"
            [parentForm]="addToCartForm"
            [ngClass]="{ 'ml-md-auto': isEditMode }"
            controlName="quantity"
          ></camfil-product-quantity>
        </form>
        <div class="prices" [ngClass]="{ 'ml-md-auto': isEditMode }">
          <ng-container *ngTemplateOutlet="price"></ng-container>
        </div>
      </div>
    </ng-container>
  </div>

  <ng-template #price>
    <camfil-product-attribute
      name="camfil.product.list_price.label"
      [value]="product.listPrice | ishPrice"
    ></camfil-product-attribute>
    <camfil-product-attribute
      name="camfil.product.your_price.label"
      [value]="product.salePrice | ishPrice"
    ></camfil-product-attribute>
  </ng-template>

    #moveDialog
