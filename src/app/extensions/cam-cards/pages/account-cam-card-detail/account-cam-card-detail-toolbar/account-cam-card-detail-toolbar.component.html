<div class="row px-4" [ngClass]="{ 'sticky box-shadow': isSticky }">
  <div class="{{ isSticky ? 'container' : 'col-12' }} text-right">
    <h2 class="cam-card-title float-left">{{ title }}</h2>
    <button mat-stroked-button color="primary">
      <mat-icon svgIcon="plus" class="size-31"></mat-icon>
      {{ 'camfil.account.cam_cards.details.button.add_section.label' | translate }}
    </button>
    <button mat-stroked-button color="primary">
      <mat-icon svgIcon="plus" class="size-31"></mat-icon>
      {{ 'camfil.account.cam_cards.details.button.add_product.label' | translate }}
    </button>
    <button mat-stroked-button color="primary" (click)="deleteCurrentCamCard()">
      <mat-icon svgIcon="delete" class="size-15"></mat-icon>
      {{ 'camfil.account.cam_cards.details.button.delete_camcard.label' | translate }}
    </button>
    <button mat-raised-button color="primary" (click)="addToCart()">
      <mat-icon svgIcon="cart" class="color-light size-15"></mat-icon>
      {{ 'camfil.account.cam_cards.details.button.add_to_cart.label' | translate }}
    </button>
  </div>
</div>
