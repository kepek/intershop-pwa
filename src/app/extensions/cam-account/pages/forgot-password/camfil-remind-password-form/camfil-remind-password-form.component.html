<form name="PasswordReminderForm" [formGroup]="form" class="form-horizontal password-form" (ngSubmit)="submitForm()">
  <mat-form-field appearance="fill" class="password-form__field">
    <mat-label>{{ 'camfil.account.forgotdata.username.label' | translate }}</mat-label>
    <input matInput required [formControl]="usernameFormControl" type="text" name="usernameFormControl" />
  </mat-form-field>

  <camfil-error
    [errors]="usernameFormControl.errors"
    [errorValidators]="errorValidator"
    [touched]="usernameFormControl.touched"
  >
  </camfil-error>

  <camfil-lazy-captcha topic="forgotPassword" [form]="form" cssClass="offset-md-4 col-md-8"></camfil-lazy-captcha>

  <div class="form-group">
    <button
      mat-raised-button
      type="submit"
      value="PasswordReminder"
      name="passwordReminder"
      color="primary"
      attr.aria-label="{{ 'camfil.account.remind_password.button.aria' | translate }}"
      class="password-form__button"
      [disabled]="buttonDisabled"
    >
      {{ 'camfil.forgot_password.form.send.button.label' | translate }}
    </button>
  </div>
</form>
