<div class="col-md-6 update-password">
  <h1 class="heading">{{ 'camfil.account.update_password.change_your_password.heading' | translate }}</h1>

  <ish-error-message [error]="error$ | async"></ish-error-message>

  <div>
    <camfil-update-password-form (submitPassword)="requestPasswordChange($event)"></camfil-update-password-form>
  </div>

  <ish-loading *ngIf="loading$ | async"></ish-loading>
</div>
