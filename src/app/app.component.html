<div [ngClass]="wrapperClasses$ | async">
  <header class="top" data-testing-id="page-header">
    <camfil-header></camfil-header>
  </header>

  <div class="wrapper">
    <ng-container *ngIf="!isIeBrowser; else ieBlock">
      <div class="container main-container" role="main" style="position: relative; min-height: 200px">
        <camfil-breadcrumb
          [productDetail]="isProductDetailPage()"
          [url]="_router.url"
        ></camfil-breadcrumb>
        <router-outlet></router-outlet>
      </div>
    </ng-container>
    <ng-template #ieBlock>
      <camfil-ie-modal></camfil-ie-modal>
    </ng-template>
  </div>

  <footer data-testing-id="section-footer">
    <camfil-footer [deviceType]="deviceType$ | async"></camfil-footer>
  </footer>
</div>
