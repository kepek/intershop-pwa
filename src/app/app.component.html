<!-- Google Tag Manager (noscript) -->
<ng-container *ngIf="gtmToken">
  <noscript><iframe [src]="gtmUrl" height="0" width="0" style="display: none; visibility: hidden"></iframe></noscript>
</ng-container>
<!-- End Google Tag Manager (noscript) -->

<div [ngClass]="wrapperClasses$ | async">
  <header data-testing-id="page-header" class="top"><camfil-header></camfil-header></header>

  <div class="wrapper">
    <div role="main" class="container main-container" style="position: relative; min-height: 200px">
      <camfil-breadcrumb [checkout]="isCheckoutPage()" [url]="_router.url"></camfil-breadcrumb>
      <router-outlet></router-outlet>
    </div>
  </div>

  <footer data-testing-id="section-footer"><camfil-footer [deviceType]="deviceType$ | async"></camfil-footer></footer>
</div>
