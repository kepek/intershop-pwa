<div class="camfil-banner" [ngStyle]="backgroundImageUrl && { 'background-image': 'url(' + backgroundImageUrl + ')' }">
  <div class="camfil-banner__header">
    <mat-icon svgIcon="{{ iconName }}" class="material-icons size-64 color-dark"></mat-icon>
    <h1 class="camfil-banner__header--title">{{ title }}</h1>
  </div>
  <h3 *ngIf="description" class="camfil-banner__description">{{ description }}</h3>
  <a
    *ngIf="linkTitle"
    class="camfil-banner__link"
    mat-raised-button
    href="{{ linkUrl }}"
    target="_blank"
    color="primary"
    >{{ linkTitle }}</a
  >
</div>
