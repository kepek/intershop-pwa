<div *ngIf="touched">
  <div *ngFor="let errorValidator of errorValidators">
    <mat-error *ngIf="errors && errors[errorValidator.error] && !errors[errorValidator.ifNot]" class="error-field">
      {{ errorValidator.message | translate: getMessageVariables(errorValidator) }}
    </mat-error>
  </div>
</div>
