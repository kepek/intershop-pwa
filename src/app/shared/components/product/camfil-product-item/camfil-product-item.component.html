<ng-container *ngIf="product$ | async as product">
  <camfil-product-item-simple
    *ngIf="isSimpleView"
    [configuration]="configuration"
    [product]="product"
    [quantity]="quantity"
    (quantityChange)="quantityChange.emit($event)"
    [category]="category"
    [variationOptions]="productVariationOptions$ | async"
    [isInCompareList]="isInCompareList$ | async"
    (productToBasket)="addToBasket($event)"
    (compareToggle)="toggleCompare()"
    (selectVariation)="replaceVariation($event)"
    [isMobileView]="isMobileView"
    [isLoggedIn]="isLoggedIn$ | async"
    [hideAttributeName]="true"
    [actionTemplate]="actionTemplate"
    [userPermissions$]="userPermissions$"
    (resetQuantityValue)="resetFormValues($event)"
    [categoryFilterParams]="filterParams"
  ></camfil-product-item-simple>

  <camfil-product-item-detailed
    *ngIf="isDetailedView"
    [configuration]="configuration"
    [product]="product"
    [quantity]="quantity"
    (quantityChange)="quantityChange.emit($event)"
    [category]="category"
    [variationOptions]="productVariationOptions$ | async"
    [isInCompareList]="isInCompareList$ | async"
    (productToBasket)="addToBasket($event)"
    (compareToggle)="toggleCompare()"
    (selectVariation)="replaceVariation($event)"
    [isLoggedIn]="isLoggedIn$ | async"
    [hideAttributeName]="hideAttributeName"
    [actionTemplate]="actionTemplate"
    [userPermissions$]="userPermissions$"
    (resetQuantityValue)="resetFormValues($event)"
    [categoryFilterParams]="filterParams"
  ></camfil-product-item-detailed>
</ng-container>

<camfil-loading *ngIf="loading$ | async"></camfil-loading>
