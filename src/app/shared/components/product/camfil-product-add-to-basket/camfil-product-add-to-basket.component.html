<ng-container *ishFeature="'camCards'; else standardAddProduct">
  <camfil-product-add-to-basket-modal
    (resetQuantityValue)="resetFormValues()"
    [disabled]="disabled"
    [displayType]="displayType"
    [hasIcon]="hasIcon"
    [product]="product"
    [quantity]="quantity"
    [translationKey]="buttonTranslationKey"
  ></camfil-product-add-to-basket-modal>
</ng-container>

<ng-template #standardAddProduct>
  <ish-product-add-to-basket
    (productToBasket)="addToBasket()"
    [attr.title]="translationKey | translate"
    [class]="'btn-lg btn-block'"
    [disabled]="disabled || (displaySpinner$ | async)"
    [product]="product"
  ></ish-product-add-to-basket>
</ng-template>
