<div *ngIf="product?.inStock && product?.availability" class="add-to-cart">
  <button
    type="submit"
    name="addProduct"
    class="btn"
    [ngClass]="class"
    [class.btn-primary]="!displayIcon"
    [class.round-cart-btn]="displayType === 'round-button'"
    [class.mat-flat-button]="displayType === 'button' || displayType === 'big-round-button'"
    [class.cart-big-round-btn]="displayType === 'big-round-button'"
    [disabled]="disabled || (displaySpinner$ | async)"
    [attr.title]="translationKey | translate"
    data-testing-id="addToCartButton"
    (click)="addToBasket()"
  >
    <ng-container *ngIf="!(displaySpinner$ | async); else spinning">
      <!-- Add to Cart button -->
      <ng-container *ngIf="displayIcon || displayType === 'round-button' else defaultButton">
        <mat-icon svgIcon="cart" class="cart-icon" [class.color-light]="displayType === 'round-button'"></mat-icon>
      </ng-container>

      <ng-template #defaultButton>{{ translationKey | translate }}</ng-template>
    </ng-container>
    <!-- button with spinning animation after Add to Cart -->
    <ng-template #spinning>
      <fa-icon [icon]="['fas', 'spinner']" [spin]="true" [ngClass]="{ 'pr-3': !displayIcon }"></fa-icon>
      <span *ngIf="!displayIcon">{{ 'common.button.spinning.label' | translate }}</span>
    </ng-template>
  </button>
</div>
