<div class="product-tile" [attr.data-testing-sku]="product.sku">
  <div class="product-image-container">
    <a [routerLink]="product | ishProductRoute: category">
      <camfil-product-image [product]="product" imageType="M" class="product-image"></camfil-product-image>
    </a>
    <camfil-product-label [product]="product"></camfil-product-label>
  </div>

  <a *ngIf="configuration.displayName" class="product-title" [routerLink]="product | ishProductRoute: category">{{
    product.name
  }}</a>

  <camfil-product-rating *ishFeature="'rating'" [product]="product"></camfil-product-rating>

  <ng-container *ishFeature="'tacton'; else standardInformation">
    <ng-container *ishIsTactonProduct="product; else standardInformation"></ng-container>
  </ng-container>

  <ng-template #standardInformation>
    <camfil-product-promotion
      *ngIf="configuration.displayPromotions"
      [product]="product"
      displayType="simple"
    ></camfil-product-promotion>

    <div *ngIf="configuration.displayPrice" class="price-container">
      <camfil-product-price [product]="product" [showInformationalPrice]="true"></camfil-product-price>
    </div>
  </ng-template>

  <div *ngIf="configuration.displayPrice" class="price-container">
    <camfil-product-price [product]="product" [showInformationalPrice]="true"></camfil-product-price>
  </div>

  <camfil-product-variation-select
    *ngIf="variationOptions && configuration.displayVariations"
    [readOnly]="configuration.readOnly"
    [variationOptions]="variationOptions"
    (selectVariation)="variationSelected($event)"
  ></camfil-product-variation-select>
  <ng-container *ngIf="isMasterProduct(product)">
    <span class="product-variation read-only">{{ variationCount }} {{ 'product.variations.text' | translate }}</span>
  </ng-container>

  <div class="product-tile-actions btn-group">
    <ish-lazy-product-add-to-quote
      *ngIf="configuration.displayAddToQuote && !isMasterProduct(product)"
      [product]="product"
      displayType="icon"
      class="btn-link"
    ></ish-lazy-product-add-to-quote>
    <camfil-product-add-to-compare
      *ngIf="configuration.displayAddToCompare"
      [isInCompareList]="isInCompareList"
      displayType="icon"
      class="btn-link"
      (compareToggle)="toggleCompare()"
    ></camfil-product-add-to-compare>
    <ish-lazy-product-add-to-order-template
      *ngIf="configuration.displayAddToOrderTemplate"
      [class]="'btn btn-link mr-0'"
      [product]="product"
      [quantity]="1"
      displayType="icon"
    ></ish-lazy-product-add-to-order-template>
    <ish-lazy-product-add-to-wishlist
      *ngIf="configuration.displayAddToWishlist"
      class="btn-link"
      [product]="product"
      displayType="icon"
    ></ish-lazy-product-add-to-wishlist>
    <camfil-product-add-to-basket
      *ngIf="configuration.displayAddToBasket && !isMasterProduct(product)"
      [product]="product"
      displayType="icon"
      class="btn-link"
      (productToBasket)="addToBasket()"
    ></camfil-product-add-to-basket>
  </div>
</div>
