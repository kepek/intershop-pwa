<div class="filters-row row align-items-center">
  <div class="col-md-7 col-sm-10">
    <div class="row align-items-center">
      <div class="col-12">
        {{ 'camfil.product.items.showing.text' | translate }} <strong>{{ categoryName }}</strong> |
        <span *ngIf="itemCount >= 0" class="pagination-total text-nowrap">
          {{ itemCount | i18nPlural: ('camfil.product.items.label' | translate) || { other: '#' } }}
        </span>
      </div>
      <div class="col-12">
        <ish-product-list-paging
          *ngIf="pageIndices && pageIndices.length && currentPage"
          [currentPage]="currentPage"
          [pageIndices]="pageIndices"
          [fragmentOnRouting]="fragmentOnRouting"
        ></ish-product-list-paging>
      </div>
    </div>
  </div>
  <div
    class="col-4 col-xs-3 col-sm-2 switch-layout"
    [ngClass]="{ 'col-md-2': sortOptions.length, 'col-md-5': !sortOptions.length }"
  >
    <div class="sort-by align-items-center justify-content-end">
      <a
        class="list-view-link"
        [ngClass]="{ 'list-active': listView }"
        data-testing-id="list-view-link"
        [routerLink]="[]"
        queryParamsHandling="merge"
        [queryParams]="{ view: 'list' }"
        replaceUrl
        [fragment]="fragmentOnRouting"
      >
        <fa-icon [icon]="['fas', 'list']"></fa-icon>
      </a>
      <a
        class="grid-view-link"
        [ngClass]="{ 'grid-active': gridView }"
        data-testing-id="grid-view-link"
        [routerLink]="[]"
        queryParamsHandling="merge"
        [queryParams]="{ view: 'grid' }"
        replaceUrl
        [fragment]="fragmentOnRouting"
      >
        <fa-icon [icon]="['fas', 'th']"></fa-icon>
      </a>
    </div>
  </div>
  <div *ngIf="sortOptions.length" class="col-8 col-xs-9 col-sm-12 col-md-3 pull-right sort-by">
    <select
      [formControl]="sortDropdown"
      class="form-control sort-by-filter"
      id="SortingAttribute"
      name="SortingAttribute"
    >
      <option *ngFor="let o of sortOptions" [value]="o.value">{{ o.label }}</option>
    </select>
  </div>
</div>
<div class="filters-row row">
  <div class="col-12">
    <camfil-filter-applied></camfil-filter-applied>
  </div>
</div>
