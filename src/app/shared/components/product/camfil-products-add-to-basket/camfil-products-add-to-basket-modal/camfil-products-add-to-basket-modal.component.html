<ng-template #buttonInner>
  <ng-container *ngIf="!(displaySpinner$ | async); else spinning">
    <!-- Add to Cart button -->
    <ng-container *ngIf="displayIcon; else defaultButton">
      <mat-icon svgIcon="cart" class="mat-icon notranslate color-light"></mat-icon>
    </ng-container>

    <ng-template #defaultButton>
      <mat-icon svgIcon="cart" *ngIf="hasIcon" class="mat-icon notranslate color-light"></mat-icon
      ><span class="button-text">{{ translationKey | translate }}</span></ng-template
    >
  </ng-container>
  <!-- button with spinning animation after Add to Cart -->
  <ng-template #spinning>
    <fa-icon [icon]="['fas', 'spinner']" [spin]="true" [ngClass]="{ 'pr-3': !displayIcon }"></fa-icon>
    <span *ngIf="!displayIcon">{{ 'common.button.spinning.label' | translate }}</span>
  </ng-template>
</ng-template>

<div class="add-to-cart">
  <ng-container *ngIf="hasIcon">
    <button
      mat-raised-button
      data-testing-id=" addProductsToCartButton"
      class="btn btn-link"
      [color]="color"
      [ngClass]="class"
      [disabled]="disabled || (displaySpinner$ | async)"
      [attr.title]="translationKey | translate"
      (click)="openModalIfLoggedIn(addProductsToCartModal)"
    >
      <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
    </button>
  </ng-container>
  <ng-container *ngIf="displayType === 'button' && !hasIcon">
    <button
      mat-flat-button
      data-testing-id="addProductsToCartButton"
      class="btn btn-link"
      [color]="color"
      [ngClass]="class"
      [disabled]="disabled || (displaySpinner$ | async)"
      [attr.title]="translationKey | translate"
      (click)="openModalIfLoggedIn(addProductsToCartModal)"
    >
      <ng-container *ngTemplateOutlet="buttonInner"></ng-container>
    </button>
  </ng-container>
</div>

<camfil-add-products-to-cart-modal #addProductsToCartModal [products]="products"></camfil-add-products-to-cart-modal>
