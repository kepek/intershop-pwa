<div *ngIf="product.inStock && product.availability" [formGroup]="parentForm" class="product-quantity">
  <ng-container *ngIf="!readOnly">
    <ng-container [ngSwitch]="type">
      <mat-form-field *ngSwitchCase="'select'" appearance="fill">
        <mat-label>{{ quantityLabel | translate }}</mat-label>
        <mat-select [formGroup]="parentForm" [formControlName]="controlName">
          <mat-option *ngFor="let quantityOption of quantityOptions" [value]="quantityOption.value">
            {{ quantityOption.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <camfil-counter
        *ngSwitchCase="'counter'"
        [form]="parentForm"
        [controlName]="controlName"
        [min]="allowZeroQuantity ? 0 : product.minOrderQuantity"
        [max]="product.maxOrderQuantity"
      ></camfil-counter>
      <ng-container *ngSwitchDefault>
        <mat-form-field appearance="fill">
          <mat-label>{{ quantityLabel | translate }}</mat-label>
          <input
            matInput
            [type]="'number'"
            [formGroup]="parentForm"
            [formControlName]="controlName"
            [min]="allowZeroQuantity ? 0 : product.minOrderQuantity"
            [max]="product.maxOrderQuantity"
            [placeholder]="allowZeroQuantity ? 0 : product.minOrderQuantity"
          />
        </mat-form-field>
      </ng-container>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="readOnly">
    <span>{{ quantityLabel | translate }}: {{ quantity }}</span>
  </ng-container>
</div>
