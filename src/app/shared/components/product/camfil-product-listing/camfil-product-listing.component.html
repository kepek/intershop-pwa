<a *ngIf="fragmentOnRouting === 'product-list-top'" id="product-list-top"></a>
<ng-container *ngIf="productListingView$ | async as listing">
  <ng-container *ngIf="!onlyList; else list">
    <div
      *ngIf="isEndlessScrolling"
      infiniteScroll
      (scrolled)="loadMoreProducts('down')"
      (scrolledUp)="loadMoreProducts('up')"
      alwaysCallback="true"
      immediateCheck="true"
    >
      <camfil-product-list-toolbar
        [itemCount]="listing.itemCount"
        [sortableAttributes]="listing.sortableAttributes"
        [viewType]="viewType$ | async"
        [sortBy]="sortBy$ | async"
        [categoryName]="category ? category.name : null"
        [fragmentOnRouting]="fragmentOnRouting"
      ></camfil-product-list-toolbar>

      <camfil-product-list
        [products]="listing.products()"
        [category]="category"
        [viewType]="viewType$ | async"
        [searchTerm]="searchTerm$ | async"
      ></camfil-product-list>
    </div>

    <div *ngIf="isPaging">
      <ng-container *ngIf="currentPage$ | async as currentPage">
        <ng-template #pagingToolbar>
          <camfil-product-list-toolbar
            [itemCount]="listing.itemCount"
            [sortableAttributes]="listing.sortableAttributes"
            [viewType]="viewType$ | async"
            [sortBy]="sortBy$ | async"
            [currentPage]="currentPage"
            [pageIndices]="listing.pageIndices(currentPage)"
            [fragmentOnRouting]="fragmentOnRouting"
            [isPaging]="true"
          ></camfil-product-list-toolbar>
        </ng-template>

        <ng-container *ngTemplateOutlet="pagingToolbar"></ng-container>

        <camfil-product-list
          [products]="listing.productsOfPage(currentPage)"
          [category]="category"
          [viewType]="viewType$ | async"
        ></camfil-product-list>

        <ng-container *ngTemplateOutlet="pagingToolbar"></ng-container>
      </ng-container>
    </div>
  </ng-container>

  <ng-template #list>
    <ng-container *ngIf="listing.itemCount">
      <h3 class="bg-light">
        {{ 'camfil.listing.only.list.products.title' | translate }}
        <small>{{
          'camfil.listing.only.list.products.showing'
            | translate
              : {
                  '0': limitItemsOnList && listing.itemCount > limitItemsOnList ? limitItemsOnList : listing.itemCount,
                  '1': listing.itemCount
                }
        }}</small>
      </h3>
      <camfil-product-list
        [products]="listing.products()"
        viewType="simple"
        [limit]="limitItemsOnList"
      ></camfil-product-list>
    </ng-container>
  </ng-template>
</ng-container>
