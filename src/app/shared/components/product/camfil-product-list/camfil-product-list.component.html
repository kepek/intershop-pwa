<div class="product-list row">
  <div *ngIf="!products.length">
    <ng-container *ngIf="!(listingLoading$ | async)">
      {{ 'search.noresult.filtered_products.message' | translate }}
    </ng-container>
  </div>

  <div *ngIf="listingLoading$ | async" class="product-list-loading">
    <ish-loading [standalone]="true"></ish-loading>
  </div>

  <ng-container *ngFor="let sku of products">
    <div *ngIf="isSimpleView" class="col-lg-12 product-list-item simple-view">
      <camfil-product-item [configuration]="{ displayType: 'simple' }" [productSku]="sku" [category]="category">
      </camfil-product-item>
    </div>

    <div *ngIf="isDetailedView" class="col-lg-12 product-list-item detailed-view">
      <camfil-product-item [configuration]="{ displayType: 'detailed' }" [productSku]="sku" [category]="category">
      </camfil-product-item>
    </div>
  </ng-container>

  <div *ngIf="listingLoading$ | async" class="col-12">
    <ish-loading [standalone]="true"></ish-loading>
  </div>
</div>
