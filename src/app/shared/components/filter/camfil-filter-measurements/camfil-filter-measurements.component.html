<camfil-filter-collapsable title="{{ 'camfil.navigation.filter.measurements.title' | translate }}">
  <form class="form">
    <div class="form-group">
      <label>{{ 'camfil.navigation.filter.measurements.width' | translate }} <span>(mm)</span></label>
      <input
        type="number"
        placeholder="xxx"
        [class.mat-elevation-z2]="true"
        (keyup)="change($event.target.value, 'width')"
      />
    </div>
    <div class="form-group">
      <label>{{ 'camfil.navigation.filter.measurements.height' | translate }} <span>(mm)</span></label>
      <input
        type="number"
        placeholder="xxx"
        [class.mat-elevation-z2]="true"
        (keyup)="change($event.target.value, 'height')"
      />
    </div>
    <div class="form-group">
      <label>{{ 'camfil.navigation.filter.measurements.depth' | translate }} <span>(mm)</span></label>
      <input
        type="number"
        placeholder="xxx"
        [class.mat-elevation-z2]="true"
        (keyup)="change($event.target.value, 'depth')"
      />
    </div>
    <button color="primary" mat-flat-button [disabled]="isDisabled()" (click)="filter()">Ok</button>
  </form>
  <camfil-filter-info note="{{ 'camfil.navigation.filter.measurements.info' | translate }}"></camfil-filter-info>
</camfil-filter-collapsable>
