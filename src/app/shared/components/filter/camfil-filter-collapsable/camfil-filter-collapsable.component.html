<div class="filter-group" [ngClass]="{ collapsed: isCollapsed }">
  <h3 (click)="toggle()" [attr.aria-expanded]="!isCollapsed" aria-controls="collapseFilter">
    {{ title }}
    <fa-icon *ngIf="isCollapsed" [icon]="['fas', 'plus']" class="float-right"></fa-icon>
    <fa-icon *ngIf="!isCollapsed" [icon]="['fas', 'minus']" class="float-right"></fa-icon>
  </h3>

  <ng-content></ng-content>
</div>
