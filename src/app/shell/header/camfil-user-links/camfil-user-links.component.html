<ul class="user-links">
  <!-- dropdown links tablet/desktop -->
  <li class="dropdown" [matMenuTriggerFor]="menu" *ngIf="deviceType !== 'mobile'">
    <a>{{ 'camfil.header.dropdown.title' | translate }}</a>
    <mat-menu #menu="matMenu">
      <ng-container *ngTemplateOutlet="dropdownLinks"></ng-container>
    </mat-menu>
  </li>

  <!-- dropdown links mobile -->
  <li *ngIf="deviceType === 'mobile'">
    <ng-container *ngTemplateOutlet="dropdownLinks"></ng-container>
  </li>

  <li class="link-languages" *ngIf="deviceType === 'mobile'">
    <camfil-language-switch
      (isClosedLangList)="toggleLang($event)"
      view="{{ deviceType === 'mobile' ? 'onMobile' : 'onMobile' }}"
      data-testing-id="language-switch-desktop"
    ></camfil-language-switch>
  </li>

  <!-- Header top links from CMS -->
  <ng-container *ngIf="closedLangList">
    <li class="no-separator">
      <ish-content-include includeId="camfil.include.header.topLinks.pagelet2-Include"></ish-content-include>
    </li>
  </ng-container>
</ul>

<ng-template #dropdownLinks>
  <ish-content-include includeId="camfil.include.header.dropdownLinks.pagelet2-Include"></ish-content-include>
</ng-template>
