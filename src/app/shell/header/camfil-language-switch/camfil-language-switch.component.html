<div
  *ngIf="locale$ | async as locale"
  class="language-switch"
  [ngClass]="view"
  ngbDropdown
  placement="{{ placement === 'up' ? 'top-right' : 'bottom-right' }}"
>
  <ng-container *ngIf="view !== 'onMobile'; else inMobileNav">
    <ng-container *ngIf="(availableLocalesByCountryCode$ | async)?.length > 1; else noDropDown">
      <a class="language-switch-link dropdown-toggle" [matMenuTriggerFor]="menu">
        <mat-icon svgIcon="globe" class="color-secondary language-switch--globe"></mat-icon>
        <span class="language-switch-current-selection d-inline">
          {{ (view === 'accordion' ? locale.displayLong : locale.displayName) | translate }}
          <span class="switch_arrow"></span>
        </span>
      </a>
      <mat-menu #menu="matMenu">
        <ng-container *ngIf="availableLocalesByCountryCode$ | async as availableLocales">
          <ng-container *ngFor="let l of availableLocales">
            <ng-container *ngIf="l.lang !== locale.lang">
              <a
                mat-menu-item
                (click)="changeLocale($event, l.lang)"
                [href]="
                  getBaseUrl({ redirect: '1', lang: l.lang }) || (location | makeHref: { redirect: '1', lang: l.lang })
                "
              >
                {{ l.displayLong }}
              </a>
            </ng-container>
          </ng-container>
        </ng-container>
      </mat-menu>
    </ng-container>
  </ng-container>

  <ng-template #inMobileNav>
    <a
      (click)="showList = !showList; toggleLevel(showList)"
      [ngClass]="{ open: showList }"
      class="d-flex align-items-center"
    >
      <mat-icon svgIcon="globe" class="color-primary language-switch--globe"></mat-icon>
      <span class="language-switch-current-selection d-inline">{{ locale.displayLong | translate }}</span>
      <mat-icon class="language-switch--arrow">arrow_{{ showList ? 'left' : 'right' }}</mat-icon>
    </a>
    <ng-container *ngIf="availableLocalesByCountryCode$ | async as availableLocales">
      <ul *ngIf="availableLocales.length && showList">
        <ng-container *ngFor="let l of availableLocales">
          <li *ngIf="l.lang !== locale.lang">
            <a
              (click)="changeLocale($event, l.lang)"
              [href]="
                getBaseUrl({ redirect: '1', lang: l.lang }) || (location | makeHref: { redirect: '1', lang: l.lang })
              "
            >
              {{ l.displayLong | translate }}
            </a>
          </li>
        </ng-container>
      </ul>
    </ng-container>
  </ng-template>

  <ng-template #noDropDown>
    <div class="language-switch-link no-drop-down d-flex align-items-center">
      <mat-icon svgIcon="globe" class="color-secondary language-switch--globe"></mat-icon>
      <span class="language-switch-current-selection d-inline">
        {{ (view === 'accordion' ? locale.displayLong : locale.displayName) | translate }}
      </span>
    </div>
  </ng-template>
</div>
