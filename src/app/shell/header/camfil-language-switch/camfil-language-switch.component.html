<div
  *ngIf="locale$ | async as locale"
  class="language-switch"
  [ngClass]="view"
  ngbDropdown
  placement="{{ placement === 'up' ? 'top-right' : 'bottom-right' }}"
>
  <ng-container *ngIf="view !== 'onMobile'; else inMobileNav">
    <a ngbDropdownToggle class="language-switch-link">
      <mat-icon svgIcon="globe" class="color-secondary language-switch--globe"></mat-icon>
      <span class="language-switch-current-selection d-inline"
        >{{ view === 'accordion' ? locale.displayName : locale.value }}<span class="switch_arrow"></span
      ></span>
    </a>
    <div ngbDropdownMenu class="language-switch-container dropdown-menu" style="left: 0 !important;">
      <div class="language-switch-menu-container">
        <ng-container *ngIf="availableLocales$ | async as availableLocales">
          <ul *ngIf="availableLocales.length">
            <ng-container *ngFor="let l of availableLocales">
              <li *ngIf="l.lang !== locale.lang">
                <a [href]="location | makeHref: { redirect: '1', lang: l.lang }"> {{ l.displayName }} </a>
              </li>
            </ng-container>
          </ul>
        </ng-container>
      </div>
    </div>
  </ng-container>

  <ng-template #inMobileNav>
    <a
      (click)="showList = !showList; toggleLevel(showList)"
      [ngClass]="{ open: showList }"
      class="d-flex align-items-center"
    >
      <mat-icon svgIcon="globe" class="color-primary language-switch--globe"></mat-icon>
      <span class="language-switch-current-selection d-inline">{{ locale.displayName }}</span>
      <mat-icon class="language-switch--arrow">arrow_{{ showList ? 'left' : 'right' }}</mat-icon>
    </a>
    <ng-container *ngIf="availableLocales$ | async as availableLocales">
      <ul *ngIf="availableLocales.length && showList">
        <ng-container *ngFor="let l of availableLocales">
          <li *ngIf="l.lang !== locale.lang">
            <a [href]="location | makeHref: { redirect: '1', lang: l.lang }"> {{ l.displayName }} </a>
          </li>
        </ng-container>
      </ul>
    </ng-container>
  </ng-template>
</div>
