<button (click)="dialogRef.close()" aria-label="Close" class="close">
  <mat-icon aria-hidden="true" svgIcon="inactive"></mat-icon>
</button>
<div class="text-center">
  <mat-icon class="contact-icon" svgIcon="contact"></mat-icon>
</div>
<p class="text-center">
  <strong>{{ 'camfil.checkout.cta.add_email_recipients_for' | translate }}</strong>
</p>

<form (ngSubmit)="submitAddEmailRecipientForm($event)" [formGroup]="recipientsForm">
  <mat-form-field appearance="fill" class="d-block">
    <mat-label>{{ 'camfil.checkout.cta.enter_email_address' | translate }}</mat-label>
    <input
      aria-controls="my-helper-id"
      formControlName="emailRecipients"
      label="Enter email address"
      matInput
      type="text"
    />
    <camfil-error
      [errorValidators]="validators.emailRecipients"
      [errors]="getField('emailRecipients').errors"
      [touched]="getField('emailRecipients').touched || getField('emailRecipients').dirty"
    ></camfil-error>
  </mat-form-field>
  <p>{{ 'camfil.checkout.cta.separate_multiple_addresses' | translate }}</p>
  <div class="col-12 text-right p-0 mt-2">
    <button (click)="dialogRef.close()" class="btn-tool text-primary" mat-flat-button type="button">
      {{ 'camfil.account.cam_card.move.dialog.btn.cancel' | translate }}
    </button>
    <button
      (click)="submitAddEmailRecipientForm($event)"
      attr.aria-label="{{ 'camfil.account.cam_card.move.dialog.btn.aria' | translate }}"
      class="btn-tool text-primary"
      data-testing-id="cam-card-dialog-move-submit"
      mat-flat-button
      type="submit"
      type="submit"
    >
      {{ 'camfil.checkout.cta.recipients_save' | translate }}
    </button>
  </div>
</form>
