<camfil-banner [title]="'camfil.account.apply_heading' | translate" iconName="users"></camfil-banner>

<div class="registration__wrapper">
  <div class="col-sm-12 col-lg-4 registration__wrapper--section">
    <camfil-registration-form [error]="userError$ | async" (create)="onCreate($event)" (cancel)="onCancel()">
    </camfil-registration-form>
  </div>
  <div class="col-sm-12 col-lg-8 registration__wrapper--section">
    <camfil-info-section></camfil-info-section>
  </div>
</div>
