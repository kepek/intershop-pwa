<camfil-header-box
  [header]="'camfil.account.register.heading' | translate"
  [description]="'camfil.account.register.message' | translate"
></camfil-header-box>

<ish-error-message [error]="error"></ish-error-message>

<div class="registration-form section" data-testing-id="account-create-full-page">
  <form [formGroup]="form" (ngSubmit)="submitForm()" class="form-horizontal" novalidate="novalidate">
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{ 'camfil.account.register.form.firstName' | translate }}</mat-label>
      <input matInput required formControlName="firstName" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{ 'camfil.account.register.form.lastName' | translate }}</mat-label>
      <input matInput required formControlName="lastName" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{ 'camfil.account.register.form.email' | translate }}</mat-label>
      <input matInput required formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{ 'camfil.account.register.form.customer_name' | translate }}</mat-label>
      <input matInput required formControlName="customerName" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{ 'camfil.account.register.form.customer_no' | translate }}</mat-label>
      <input matInput formControlName="customerNo" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <textarea
        matInput
        formControlName="comment"
        [placeholder]="'camfil.account.register.form.add_comment' | translate"
      ></textarea>
    </mat-form-field>

    <button mat-raised-button type="submit" aria-label="Send application" [disabled]="formDisabled" color="primary">
      {{ 'camfil.account.create.button.label' | translate }}
    </button>
  </form>
</div>
