<div class="account-wrapper">
  <div class="row account-main" *ngIf="url === '/account/cam-cards'; else camCards">
    <div class="col-lg-3 account-nav-box">
      <ish-account-navigation [deviceType]="deviceType$ | async"></ish-account-navigation>
    </div>
    <div class="col-lg-9">
      <camfil-breadcrumb [account]="true"></camfil-breadcrumb>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<ng-template #camCards>
  <router-outlet></router-outlet>
</ng-template>
