<camfil-breadcrumb [checkout]="true"></camfil-breadcrumb>

<br />

<ng-container *ngIf="basket$ | async as basket">
  <div class="checkout row">
    <ish-content-include includeId="camfil.include.checkout.content.pagelet2-Include"></ish-content-include>
    <div class="col-sm-12 col-lg-9">
      <camfil-checkout-header [basket]="basket" [buckets]="buckets"></camfil-checkout-header>

      <mat-divider></mat-divider>
      <div cdkDropListGroup>
        <ng-container *ngFor="let item of emptyBuckets">
          <camfil-checkout-list [order]="item"></camfil-checkout-list>
        </ng-container>

        <ng-container *ngFor="let item of buckets">
          <camfil-checkout-list
            [order]="item"
            [buckets]="buckets"
            [shippingMethodId]="shippingMethodId"
          ></camfil-checkout-list>
        </ng-container>
      </div>
    </div>
    <div class="col-sm-12 col-lg-3">
      <camfil-checkout-summary [basket]="basket"></camfil-checkout-summary>
    </div>
  </div>
</ng-container>
