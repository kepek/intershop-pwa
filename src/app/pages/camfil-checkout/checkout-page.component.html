<camfil-loading *ngIf="(ordersLoading$ | async) || (basketLoading$ | async)" fixed="true"></camfil-loading>
<br />
<ng-container *ngIf="basket$ | async as basket">
  <div class="checkout row">
    <div class="col-sm-12 col-lg-9">
      <div [ngClass]="{ 'header-divider-container': isConfirmed }">
        <camfil-checkout-header
          [basket]="basket"
          [buckets]="buckets$ | async"
          [isConfirmed]="isConfirmed"
        ></camfil-checkout-header>
        <mat-divider></mat-divider>
      </div>

      <div>
        <ish-basket-info></ish-basket-info>
        <ng-container *ngIf="!(emptyBuckets$ | async)?.length">
          <camfil-basket-validation-results></camfil-basket-validation-results>
        </ng-container>
        <camfil-checkout-validation></camfil-checkout-validation>
      </div>

      <div cdkDropListGroup>
        <ng-container *ngIf="emptyBuckets$ | async as emptyBuckets">
          <ng-container *ngFor="let emptyBucket of emptyBuckets; trackBy: trackByLineItems">
            <camfil-checkout-list [order]="emptyBucket"></camfil-checkout-list>
          </ng-container>
        </ng-container>
        <ng-container *ngIf="isConfirmed; else notConfirmed">
          <ng-container *ngIf="confirmedBuckets$ | async as confirmedBuckets">
            <ng-container *ngFor="let confirmedBucket of confirmedBuckets; index as i; trackBy: trackByLineItems">
              <camfil-checkout-list
                [order]="confirmedBucket"
                [buckets]="confirmedBuckets"
                [isConfirmed]="isConfirmed"
                [index]="i + 1"
                [basket]="basket"
              ></camfil-checkout-list>
            </ng-container>
          </ng-container>
        </ng-container>
        <ng-template #notConfirmed>
          <ng-container *ngIf="buckets$ | async as buckets">
            <ng-container *ngFor="let bucket of buckets; index as i; trackBy: trackByLineItems">
              <camfil-checkout-list
                [order]="bucket"
                [buckets]="buckets"
                [isConfirmed]="isConfirmed"
                [index]="i + 1"
                [basket]="basket"
              ></camfil-checkout-list>
            </ng-container>
          </ng-container>
        </ng-template>
      </div>
    </div>
    <div class="col-sm-12 col-lg-3">
      <camfil-checkout-summary [basket]="basket" [isConfirmed]="isConfirmed"></camfil-checkout-summary>
    </div>
  </div>
</ng-container>
