<div class="row">
  <div class="col-12 product-detail-img clearfix">
    <div class="product-image-container">
      <ngb-carousel
        #ngcarousel
        [activeId]="activeSlide"
        (slide)="setActiveSlide($event.current)"
        [showNavigationArrows]="false"
        [showNavigationIndicators]="false"
        [interval]="false"
      >
        <ng-template ngbSlide id="0">
          <camfil-product-image [product]="product" imageType="images"></camfil-product-image>
        </ng-template>
        <ng-template
          ngbSlide
          *ngFor="let imageView of getImageViewIDsExcludePrimary(product, 'images'); index as i"
          id="{{ i + 1 }}"
        >
          <camfil-product-image [product]="product" imageType="images" [imageView]="imageView"></camfil-product-image>
        </ng-template>
        <ng-container *ngIf="videoUrl">
          <ng-template ngbSlide id="{{ getVideoThumbnailIndex() }}">
            <iframe
              #videoFrame
              [src]="secureVideoUrl"
              width="270"
              frameborder="0"
              allowscriptaccess="always"
              allowfullscreen="allowfullscreen"
            ></iframe>
          </ng-template>
        </ng-container>
      </ngb-carousel>
      <camfil-product-label [product]="product"></camfil-product-label>
    </div>
  </div>
  <div class="col-12 px-3">
    <div class="product-img-thumbs" data-type="images">
      <div class="col-4 product-thumb-set" [ngClass]="{ active: isActiveSlide(0) }" (click)="setActiveSlide(0)">
        <camfil-product-image [product]="product" imageType="images" class="product-image"></camfil-product-image>
      </div>

      <div
        *ngFor="let imageView of getImageViewIDsExcludePrimary(product, 'images'); index as i"
        class="col-4 product-thumb-set"
        [ngClass]="{ active: isActiveSlide(i + 1) }"
        (click)="setActiveSlide(i + 1)"
      >
        <camfil-product-image
          [product]="product"
          imageType="images"
          [imageView]="imageView"
          class="product-image"
        ></camfil-product-image>
      </div>

      <!-- video thumbnail -->
      <div
        *ngIf="videoUrl"
        class="col-4 product-thumb-set video-thumb-wrapper"
        [ngClass]="{ active: isActiveSlide(getVideoThumbnailIndex()) }"
        (click)="setActiveSlide(getVideoThumbnailIndex())"
      >
        <div class="video-thumb">
          <img [src]="secureVideoThumbnailUrl" />
          <mat-icon class="play-icon color-secondary" svgIcon="play-arrow"></mat-icon>
        </div>
      </div>
    </div>
  </div>
</div>
