<ng-container *ngIf="routingInProgress$ | async; else ready">
  <camfil-loading></camfil-loading>
</ng-container>

<ng-template #ready>
  <div *ngIf="!(isLoggedIn$ | async)" class="mt-4">
    <p *ngIf="loginMessageKey$ | async as loginMessageKey" class="alert alert-info">
      {{ loginMessageKey | translate }}
    </p>
  </div>
  <div class="login-form row">
    <div class="col-sm-12 col-lg-4 no-padding">
      <camfil-login-form></camfil-login-form>
      <camfil-login-new-customer></camfil-login-new-customer>
    </div>
    <div class="col-sm-12 col-lg-8 no-padding">
      <ish-content-include includeId="camfil.include.login.content.pagelet2-Include"></ish-content-include>
    </div>
  </div>
</ng-template>
