#  Template NodeJS build

#  This template allows you to validate your NodeJS code.
#  The workflow allows running tests and code linting on the active pull-requests

image: node:12

pipelines:
  pull-requests:
    '**':
      - step:
          name: Test
          caches:
            - node
          script:
            - echo "$(ls -la)"
            - npm install -g @angular/cli
            - npm ci
            - npm test
      - step:
          name: Code Linting
          caches:
            - node
          script:
            - npm run lint
