#  Template NodeJS build

#  This template allows you to validate your NodeJS code.
#  The workflow allows running tests and code linting on the active pull-requests

image: node:12

pipelines:
  pull-requests:
    '**':
      - step:
          name: List Files
          script:
            - echo "$(ls -la)"
      - step:
          name: Install Dependencies
          caches:
            - node
          artifacts:
            - node_modules/**
          script:
            - npm ci
      - step:
          name: Install Angular CLI
          caches:
            - node
          script:
            - npm install -g @angular/cli
            - echo "$(which ng)"
      - step:
          name: Synchronize Lazy Components
          caches:
            - node
          artifacts:
            - src/app/extensions/**/exports/**
          script:
            - npm run synchronize-lazy-components -- --ci
          after-script:
            - cat /root/.npm/_logs/*
            - cat $(find /tmp/ng-** -name "angular-errors.log")
      - step:
          name: Generate Icons
          caches:
            - node
          artifacts:
            - projects/camfil-icons/src/exports/build/**
          script:
            - npm run build:icons
          after-script:
            - cat /root/.npm/_logs/*
            - cat $(find /tmp/ng-** -name "angular-errors.log")
      - step:
          name: Code Linting
          caches:
            - node
          script:
            - npm run lint
          after-script:
            - cat /root/.npm/_logs/*
            - cat $(find /tmp/ng-** -name "angular-errors.log")
      - step:
          name: Testing the PWA
          caches:
            - node
          script:
            - npm run test
          after-script:
            - cat /root/.npm/_logs/*
            - cat $(find /tmp/ng-** -name "angular-errors.log")
